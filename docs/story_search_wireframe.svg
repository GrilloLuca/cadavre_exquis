<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Helvetica, Arial, sans-serif">
  <title>Story search: Complete stories tab states</title>
  <rect width="1280" height="600" fill="#D5E2C8"/>

  <!-- ============ Panel A: searching, results ============ -->
  <g transform="translate(16,0)">
    <text x="0" y="24" font-size="14" font-weight="700" fill="#2E2E28">A. Searching "drag": results</text>
    <rect x="0" y="36" width="300" height="48" fill="#5E7F55"/>
    <text x="16" y="66" font-size="16" fill="#FFFFFF">Storie complete</text>
    <text x="268" y="66" font-size="16" fill="#FFFFFF">[IT]</text>
    <!-- search field -->
    <rect x="12" y="96" width="276" height="48" rx="24" fill="#F4EEDA" stroke="#3F5A3A" stroke-width="2"/>
    <text x="26" y="125" font-size="13" fill="#3F5A3A">[search]</text>
    <text x="80" y="125" font-size="15" fill="#2E2E28">drag</text>
    <text x="246" y="125" font-size="13" fill="#2E2E28">[x]</text>
    <rect x="232" y="96" width="48" height="48" fill="none" stroke="#3F5A3A" stroke-dasharray="3 3"/>
    <!-- tabs -->
    <text x="24" y="176" font-size="13" font-weight="700" fill="#3F5A3A">Altre storie (2)</text>
    <text x="170" y="176" font-size="13" fill="#2E2E28">Le tue storie (1)</text>
    <rect x="0" y="186" width="150" height="2" fill="#3F5A3A"/>
    <!-- tile 1: normal, keyword matched -->
    <g transform="translate(12,200)">
      <rect width="276" height="78" rx="14" fill="#F4EEDA" fill-opacity="0.92"/>
      <text x="14" y="42" font-size="12" fill="#5E7F55">[book]</text>
      <text x="64" y="24" font-size="14" font-weight="600" fill="#2E2E28">Il castello di Ugo</text>
      <text x="64" y="44" font-size="12" fill="#2E2E28">4 autori</text>
      <text x="64" y="64" font-size="12" fill="#2E2E28"><tspan fill="#3F5A3A">#</tspan> castello · <tspan font-weight="700" fill="#3F5A3A">drago</tspan> · nonna</text>
    </g>
    <!-- tile 2: locked, matched on keyword -->
    <g transform="translate(12,286)">
      <rect width="276" height="78" rx="14" fill="#F4EEDA" fill-opacity="0.92"/>
      <text x="14" y="42" font-size="12" fill="#3F5A3A">[lock]</text>
      <text x="64" y="24" font-size="14" font-weight="600" fill="#2E2E28">La notte del drago</text>
      <text x="64" y="44" font-size="12" fill="#2E2E28">Storia per adulti · 4 autori</text>
      <text x="64" y="64" font-size="12" fill="#2E2E28"><tspan fill="#3F5A3A">#</tspan> <tspan font-weight="700" fill="#3F5A3A">drago</tspan> · festa · città</text>
    </g>
    <text x="12" y="384" font-size="10" fill="#3F5A3A">Locked tile: AI title + child-safe keywords only,</text>
    <text x="12" y="397" font-size="10" fill="#3F5A3A">never part text. Tap still runs the age gate.</text>
    <text x="12" y="416" font-size="10" fill="#3F5A3A">Matched keyword: w700 + primaryDark (not colour only).</text>
    <text x="12" y="429" font-size="10" fill="#3F5A3A">Keyword line is shown also when not searching.</text>
    <!-- ad + nav -->
    <rect x="0" y="500" width="300" height="50" fill="#FFFFFF" stroke="#2E2E28" stroke-dasharray="4 3"/>
    <text x="110" y="530" font-size="12" fill="#2E2E28">ad banner</text>
    <rect x="0" y="550" width="300" height="44" fill="#F4EEDA"/>
    <text x="30" y="577" font-size="11" fill="#2E2E28">Da continuare</text>
    <text x="118" y="577" font-size="11" font-weight="700" fill="#3F5A3A">Complete</text>
    <text x="220" y="577" font-size="11" fill="#2E2E28">Profilo</text>
  </g>

  <!-- ============ Panel B: no match in this tab, matches in the other ============ -->
  <g transform="translate(336,0)">
    <text x="0" y="24" font-size="14" font-weight="700" fill="#2E2E28">B. No match here, 1 in the other tab</text>
    <rect x="0" y="36" width="300" height="48" fill="#5E7F55"/>
    <text x="16" y="66" font-size="16" fill="#FFFFFF">Storie complete</text>
    <rect x="12" y="96" width="276" height="48" rx="24" fill="#F4EEDA" stroke="#3F5A3A" stroke-width="1"/>
    <text x="26" y="125" font-size="13" fill="#3F5A3A">[search]</text>
    <text x="80" y="125" font-size="15" fill="#2E2E28">pirata</text>
    <text x="246" y="125" font-size="13" fill="#2E2E28">[x]</text>
    <text x="24" y="176" font-size="13" font-weight="700" fill="#3F5A3A">Altre storie (0)</text>
    <text x="170" y="176" font-size="13" fill="#2E2E28">Le tue storie (1)</text>
    <rect x="0" y="186" width="150" height="2" fill="#3F5A3A"/>
    <g transform="translate(24,250)">
      <rect width="252" height="112" rx="14" fill="#F4EEDA" fill-opacity="0.92"/>
      <text x="126" y="34" font-size="13" text-anchor="middle" fill="#2E2E28">Nessuna storia trovata qui</text>
      <text x="126" y="52" font-size="13" text-anchor="middle" fill="#2E2E28">per «pirata».</text>
      <text x="126" y="88" font-size="13" font-weight="700" text-anchor="middle" fill="#3F5A3A">Vedi 1 storia in «Le tue storie»</text>
    </g>
    <text x="12" y="390" font-size="10" fill="#3F5A3A">No automatic tab jump while typing.</text>
    <text x="12" y="403" font-size="10" fill="#3F5A3A">The TextButton (min 48dp) switches tab on tap.</text>
    <text x="12" y="416" font-size="10" fill="#3F5A3A">Card is a live region (announced when it appears).</text>
    <rect x="0" y="500" width="300" height="50" fill="#FFFFFF" stroke="#2E2E28" stroke-dasharray="4 3"/>
    <text x="110" y="530" font-size="12" fill="#2E2E28">ad banner</text>
    <rect x="0" y="550" width="300" height="44" fill="#F4EEDA"/>
  </g>

  <!-- ============ Panel C: no match anywhere ============ -->
  <g transform="translate(656,0)">
    <text x="0" y="24" font-size="14" font-weight="700" fill="#2E2E28">C. No match in either tab</text>
    <rect x="0" y="36" width="300" height="48" fill="#5E7F55"/>
    <text x="16" y="66" font-size="16" fill="#FFFFFF">Storie complete</text>
    <rect x="12" y="96" width="276" height="48" rx="24" fill="#F4EEDA" stroke="#3F5A3A" stroke-width="1"/>
    <text x="26" y="125" font-size="13" fill="#3F5A3A">[search]</text>
    <text x="80" y="125" font-size="15" fill="#2E2E28">draghi</text>
    <text x="246" y="125" font-size="13" fill="#2E2E28">[x]</text>
    <text x="24" y="176" font-size="13" font-weight="700" fill="#3F5A3A">Altre storie (0)</text>
    <text x="170" y="176" font-size="13" fill="#2E2E28">Le tue storie (0)</text>
    <rect x="0" y="186" width="150" height="2" fill="#3F5A3A"/>
    <g transform="translate(24,240)">
      <rect width="252" height="132" rx="14" fill="#F4EEDA" fill-opacity="0.92"/>
      <text x="126" y="32" font-size="13" text-anchor="middle" fill="#2E2E28">Nessuna storia trovata per «draghi».</text>
      <text x="126" y="58" font-size="12" text-anchor="middle" fill="#2E2E28">Prova con un'altra parola,</text>
      <text x="126" y="74" font-size="12" text-anchor="middle" fill="#2E2E28">oppure scrivila al singolare.</text>
      <text x="126" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#3F5A3A">Cancella ricerca</text>
    </g>
    <text x="12" y="400" font-size="10" fill="#3F5A3A">Same card in both tabs. Tab bar and field stay.</text>
    <rect x="0" y="500" width="300" height="50" fill="#FFFFFF" stroke="#2E2E28" stroke-dasharray="4 3"/>
    <text x="110" y="530" font-size="12" fill="#2E2E28">ad banner</text>
    <rect x="0" y="550" width="300" height="44" fill="#F4EEDA"/>
  </g>

  <!-- ============ Panel D: room without completed stories ============ -->
  <g transform="translate(976,0)">
    <text x="0" y="24" font-size="14" font-weight="700" fill="#2E2E28">D. Room has no completed stories</text>
    <rect x="0" y="36" width="288" height="48" fill="#5E7F55"/>
    <text x="16" y="66" font-size="16" fill="#FFFFFF">Storie complete</text>
    <g transform="translate(24,240)">
      <rect width="240" height="56" rx="14" fill="#F4EEDA" fill-opacity="0.92"/>
      <text x="120" y="33" font-size="13" text-anchor="middle" fill="#2E2E28">Nessuna storia completata, per ora.</text>
    </g>
    <text x="12" y="330" font-size="10" fill="#3F5A3A">Unchanged: no search field, no tabs.</text>
    <text x="12" y="343" font-size="10" fill="#3F5A3A">Also while loading: spinner only, no field.</text>
    <rect x="0" y="500" width="288" height="50" fill="#FFFFFF" stroke="#2E2E28" stroke-dasharray="4 3"/>
    <text x="104" y="530" font-size="12" fill="#2E2E28">ad banner</text>
    <rect x="0" y="550" width="288" height="44" fill="#F4EEDA"/>
  </g>
</svg>
