# Push to master -> test -> Play internal track + TestFlight.
# Manual run (Actions -> Deploy beta -> Run workflow) can also bump the version name first:
#   bump = patch|minor|major -> bumps pubspec.yaml, opens + merges a PR to master, then builds that commit.
# Promote to production with the "Release" workflow (Actions tab -> Release -> Run workflow).
name: Deploy beta

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the version name before building (x.y.z)
        type: choice
        options: [none, patch, minor, major]
        default: none

concurrency:
  group: deploy-beta
  cancel-in-progress: false   # never cancel an in-progress store upload

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    # Only on a manual run with bump != none. Merging with GITHUB_TOKEN does NOT trigger
    # another "Deploy beta" run, so there is no loop and no duplicate build.
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: android
      - name: Bump version in pubspec.yaml
        id: bump
        working-directory: android
        run: bundle exec fastlane android bump type:${{ inputs.bump }}
      - name: Commit, open and merge PR
        id: merge
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Bump version to $VERSION"
          # The branch may be left over from an earlier attempt: it is generated, so overwrite it
          git push --force -u origin "$branch"
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            echo "Reusing the open PR for $branch"
          else
            gh pr create --base "${{ github.ref_name }}" --head "$branch" \
              --title "Bump version to $VERSION" \
              --body "Automatic version bump (${{ inputs.bump }}) from Deploy beta run ${{ github.run_id }}."
          fi
          # GitHub may need a few seconds to compute mergeability
          for i in 1 2 3 4 5 6; do
            gh pr merge "$branch" --squash --delete-branch && break
            [ "$i" = 6 ] && { echo "::error::Could not merge the version PR automatically. If master requires approvals, approve and merge it manually, then re-run Deploy beta with bump=none."; exit 1; }
            sleep 10
          done
          sha=$(gh pr view "$branch" --json mergeCommit -q .mergeCommit.oid)
          echo "Merged as $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  android-internal:
    needs: [test, version]
    # run when tests passed and the version job either succeeded or was skipped
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.version.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: android
      - name: Write secrets to files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$PLAY_STORE_JSON_KEY" > android/fastlane/play-store-credentials.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
          # sanity checks — fail early with a readable error
          python3 -m json.tool android/fastlane/play-store-credentials.json > /dev/null || { echo "::error::PLAY_STORE_JSON_KEY is empty or not valid JSON"; exit 1; }
          python3 -m json.tool android/app/google-services.json > /dev/null || { echo "::error::GOOGLE_SERVICES_JSON is empty or not valid JSON"; exit 1; }
          [ -s android/app/upload-keystore.jks ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is empty or not valid base64"; exit 1; }
      - run: flutter pub get
      - name: Build & upload to Play internal track
        working-directory: android
        env:
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: bundle exec fastlane android internal
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  ios-testflight:
    needs: [test, version]
    # run when tests passed and the version job either succeeded or was skipped
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.version.result != 'failure' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable   # App Store uploads require the current Xcode SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ios
      - name: Write Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
      - run: flutter pub get
      - name: Build & upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios beta
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/fastlane/*.ipa
          retention-days: 30
